[workspace]
resolver = "2"
members = [
    "hyperscalees-core",
    "hyperscalees-noiser",
    "hyperscalees-models",
    "hyperscalees-envs",
    "hyperscalees",
]

# 把 cubecl-cuda 换成 vendored 副本：仅增加 3 个公开访问器
# （raw_stream / raw_context / raw_device_ptr，见 vendor/cubecl-cuda/src/compute/server.rs），
# 供 hyperscalees 集成 cuBLAS（同流 GEMM）使用。
# 把 cubek-random 换成 vendored 副本：prng 内核写向量化（Vector<E,4>），
# 数值逐位不变（RNG 状态序列一致），f32 随机吞吐 ~260GB/s -> ~700GB/s。
[patch.crates-io]
cubecl-cuda = { path = "vendor/cubecl-cuda" }
cubek-random = { path = "vendor/cubek-random" }

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Burn 0.21 uses burn-flex as the CPU backend (successor to burn-ndarray).
# flex supports f32/i32 element types, which matches the f32 JAX reference.
burn = { version = "0.21", default-features = false, features = ["flex"] }
burn-flex = { version = "0.21", default-features = false }
hyperscalees-core = { path = "hyperscalees-core" }
